<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>If/Else Practice - Console</title>
</head>
<body>
  <script>
    let num = 42;
    if (num > 0) {
      console.log("Check Positive: " + num + " is positive");
    } else {
      console.log("Check Positive: " + num + " is NOT positive");
    }

    if (num % 2 === 0) {
      console.log("Even or Odd: " + num + " is even");
    } else {
      console.log("Even or Odd: " + num + " is odd");
    }

    let score = 85;
    if (score >= 90) {
      console.log("Grading: Score " + score + " = Grade A");
    } else if (score >= 80) {
      console.log("Grading: Score " + score + " = Grade B");
    } else if (score >= 70) {
      console.log("Grading: Score " + score + " = Grade C");
    } else if (score >= 60) {
      console.log("Grading: Score " + score + " = Grade D");
    } else {
      console.log("Grading: Score " + score + " = Grade F");
    }

    let age = 22;
    let hasLicense = true;
    if (age >= 16) {
      if (hasLicense) {
        console.log("Nested If: Age " + age + " and has license -> can drive");
      } else {
        console.log("Nested If: Age " + age + " but no license -> cannot drive");
      }
    } else {
      console.log("Nested If: Age " + age + " -> too young to drive");
    }

    if (num >= 10 && num <= 20) {
      console.log("Logical &&: " + num + " is between 10 and 20");
    } else {
      console.log("Logical &&: " + num + " is NOT between 10 and 20");
    }

    if (num < 5 || num > 25) {
      console.log("Logical ||: " + num + " is less than 5 OR greater than 25");
    } else {
      console.log("Logical ||: " + num + " is NOT less than 5 or greater than 25");
    }
  </script>
</body>
</html>
