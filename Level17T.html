<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Effect</title> 
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class=" items-center justify-center flex flex-col">
         <p class="bg-gradient-to-r from-blue-400 to-purple-700 hover:scale-110 cursor-pointer ease-in-out hover:shadow-lg hover:rotate-5 duration-300 pt-22 p-15 rounded-[10px] text-white w-[15%] text-center border h-50 mt-8 mb-8 ">Hover Me!</p>
    </div>
    <div class="items-center justify-center flex flex-col mb-4">
        <p class="bg-green-600 text-white p-3 item-center flex justify-center rounded w-[14%] hover:shadow-lg  rounded-[30px] hover:bg-green-500 ">Hover Button</p>
    </div>
    <div class="items-center justify-center flex flex-col">
        <p class="bg-red-500 text-white w-50 h-50 p-15 justify-center text-center rounded-full hover:bg-red-400">Fade on Hover</p>
    </div>
    
</body>
</html>
