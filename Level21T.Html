<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <h1 class="font-bold text-2xl py-4 ml-3">Block Elements</h1>
    <div>
        <p class="border bg-blue-300 p-7 mb-2 ml-3 mr-40 border-[blue]">Block 1</p>
        <p class="border bg-blue-300 p-7 ml-3 mr-40 border-[blue]">Block 2</p>
    </div>

    <h2 class="font-bold text-[20px] py-4 ml-5">Inline Elements</h2>
    <div class="flex gap-4 ml-7">
        <p class="bg-green-300 border p-2 border-[green]">Inline 1</p>
        <p class="bg-green-300 border p-2">Inline 2</p>
        <p class="bg-green-300 border p-2">Inline 3</p>
    </div>
    <h2 class="font-bold text-[22px] py-4 ml-5">Inline-Block Elements</h2>
    <div class="flex gap-4 ml-7">
        <p class="bg-red-300 border p-4  border-[red]">Inline-Block 1</p>
        <p class="bg-red-300 border p-4 py-2 border-[red]">Inline-Block 2</p>
        <p class="bg-red-300 border p-4 py-2 border-[red]">Inline-Block 3</p>
    </div>
    <h1 class="font-bold text-[20px] py-5 ml-5">List Items</h1>
    <ul class="ml-4">
        <li>List Item 1</li>
        <li>List Item 2</li>
        <li>List Item 3</li>
    </ul>
    <h1 class="font-bold py-5 ml-4 text-[20px]">Hidden Element</h1>
    <div class="ml-5">
        <p class="bg-blue-200 border mb-2 py-10 px-2 border-[blue]">Visible Element</p>
        <p class="bg-blue-200 border py-10 mb-5 px-2 border-[blue]">Visible Element</p>
    </div>
    
    
</body>
</html>
