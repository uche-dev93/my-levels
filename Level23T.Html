<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Layout</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="bg-black py-7">
        <h2 class="font-bold text-center text-[35px] text-white">Float Layout Website</h2>
    </div>
    <div class=" flex w-full p-4">
        <div class="bg-gray-200 w-1/5 p-2">
            <h2 class="font-bold text-[20px] p-5">Navigation</h2>
            <p  class="bg-gray-100 p-2 mb-3">Menu Item 1</p>
            <p  class="bg-gray-100 p-2 mb-3">Menu Item 2</p>
            <p  class="bg-gray-100 p-2">Menu Item 3</p>
        </div>
        <div class="w-3/5 p-2">
            <h2 class="font-bold text-[20px] p-4">Main Content</h2>
            <p class="bg-gray-200 p-2 mb-3">Content Section 1</p>
            <p class="bg-gray-200 p-2 mb-3">Content Section 2</p>
            <p class="bg-gray-200 p-2 mb-3">Content Section 3</p>
        </div>
        <div class="bg-gray-200 w-1/5 p-2">
            <h2 class="font-bold p-4 text-[20px]">Sidebar</h2>
            <p  class="bg-gray-100 p-2 mb-3">Sidebar Item 1</p>
            <p  class="bg-gray-100 p-2 mb-3">Sidebar Item 2</p>
            <p  class="bg-gray-100 p-2">Sidebar Item 3</p>
        </div>
    </div>
    <p class="text-center bg-black p-5 text-white">© 2024 Float Layout Example</p>
</body>
</html>
